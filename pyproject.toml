[project]
name = "hackm-backend"
version = "0.1.0"
description = "Hackmatrix backend server!"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.40",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "mistune>=3.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "razorpay>=2.0.1",
    "redis>=8.1.0",
    "resend>=2.47.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
